apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.name }}
  # annotations:
  #   "helm.sh/hook": pre-install, pre-upgrade
  #   "helm.sh/hook-weight": "-10"
  #   "helm.sh/hook-delete-policy": before-hook-creation, hook-failed
data:
  DB_DRIVER_SYNC: {{ .Values.configMap.driver_sync }}
  DB_DRIVER_ASYNC: {{ .Values.configMap.driver_async }}
  DB_HOST: {{ include "users-app.dbhost" . | quote }}
  DB_PORT: {{ .Values.postgresql.primary.service.port | quote }}