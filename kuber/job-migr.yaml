apiVersion: batch/v1
kind: Job
metadata:
  name: run-migrations
  namespace: default
spec:
  template:
    spec:
      containers:
      - name: migrate
        image: comrademaper/zis_otus_hw4:latest 
        command: ["sh", "-c", "alembic upgrade head"]
        env:
        - name: DB_DRIVER_SYNC
          valueFrom:
            configMapKeyRef:
              name: users-config 
              key: DB_DRIVER_SYNC 
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: users-config 
              key: DB_PORT           
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: users-config 
              key: DB_HOST   
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: users-db-secret 
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: users-db-secret 
              key: password 
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: users-db-secret  
              key: database 
      restartPolicy: Never  # Не перезапускать контейнер, если он завершился (даже с ошибкой)
  backoffLimit: 4  # Максимальное количество попыток, если Job завершается с ошибкой